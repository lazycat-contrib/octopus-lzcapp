application:
  subdomain: octopus
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://octopus:8080/

services:
  octopus:
    #  ghcr.io/bestruirui/octopus:v0.9.14
    image: registry.lazycat.cloud/czyt/bestruirui/octopus:5829d8e99a8f878a
    binds:
      - /lzcapp/var/data:/app/data
