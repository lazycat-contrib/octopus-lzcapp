application:
  subdomain: octopus
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://octopus:8080/
services:
  octopus:
    #  ghcr.io/bestruirui/octopus:v0.9.14
    # upstream: ghcr.io/bestruirui/octopus:v0.9.28
    image: registry.lazycat.cloud/czyt/bestruirui/octopus:f0f45558d9468c69
    binds:
      - /lzcapp/var/data:/app/data
